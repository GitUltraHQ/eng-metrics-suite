name: Bug report
description: Report a problem with git-processor, pr-processor, eng-reports, or the docker-compose setup
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. This repo distributes
        the compiled images only -- if the issue is specific to one
        service, picking it below helps route this faster.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - git-processor
        - pr-processor
        - eng-reports
        - docker-compose / setup
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The affected image's build identifier, from
        `docker compose exec <service> env | grep GIT_COMMIT_SHA`. If you
        can't get this, the image tag or roughly when you pulled it is fine.
      placeholder: e.g. a1b2c3d, or "latest as of 2026-08-27"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As specific as you can -- commands run, config used, etc.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Structured JSON log lines around when it happened
        (`docker compose logs <service>`). Redact repo names, tokens, or
        anything else sensitive before pasting.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        OS, Docker/Compose version, and how you're running this (the
        docker-compose.yml from eng-metrics-suite as-is, a modified
        version, Kubernetes, etc.)
